<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Payment</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .payment-box {
            max-width: 400px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 20px;
        }

        .total-label {
            color: #666;
            font-size: 16px;
        }

        .total {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0 25px;
        }

        .qr {
            width: 250px;
            max-width: 100%;
        }

        .instruction {
            color: #555;
            line-height: 1.5;
        }

        .button {
            display: block;
            margin-top: 25px;
            padding: 15px;
            background: #008000;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h1>Food Order Payment</h1>

    <div class="total-label">
        Total Payment
    </div>

    <div class="total" id="total">
        RM 0.00
    </div>

    <p>Scan the QR code below to make payment.</p>

    <img src="qr.jpeg"
         alt="Payment QR"
         class="qr">

    <p class="instruction">
        Please pay the exact amount shown above.
        <br><br>
        After payment, return to the Jotform
        and upload your payment receipt.
    </p>

    <a href="YOUR-JOTFORM-URL"
       class="button">
        BACK TO ORDER
    </a>

</div>

<script>

    const params = new URLSearchParams(window.location.search);

    const amount = params.get("amount");

    if (amount) {

        const number = parseFloat(amount);

        if (!isNaN(number)) {

            document.getElementById("total").textContent =
                "RM " + number.toFixed(2);

        }

    }

</script>

</body>
</html>
